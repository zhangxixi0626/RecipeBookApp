name: Build Lynk10 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Test NAS relay
        working-directory: server
        run: |
          npm ci
          npm test
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose-relay-only.yaml config --quiet
          docker compose -f compose-ugreen.yaml config --quiet

      - name: Build NAS relay image
        run: docker build -t lynk10-relay:ci server

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :lynk10app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp lynk10app/build/outputs/apk/debug/lynk10app-debug.apk artifacts/Lynk10EV1.04.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lynk10EV1.04
          path: artifacts/Lynk10EV1.04.apk
          if-no-files-found: error
          retention-days: 30
